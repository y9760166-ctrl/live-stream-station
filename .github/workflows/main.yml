name: בדיקת שידור אוטומטית

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check-stream:
    runs-on: ubuntu-latest
    steps:
      - name: הורדת קובצי המאגר
        uses: actions/checkout@v4

      - name: התקנת Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: בדיקת תקינות תחביר JavaScript
        run: node --check server.js

      - name: בדיקת מקור השידור
        run: |
          URL="https://contact.gostreaming.tv/Con-9/tracks-v3a1/mono.ts.m3u8"

          echo "בודק את מקור השידור..."

          HTTP_CODE=$(curl -L --max-time 25 -sS \
            -D headers.txt \
            -o playlist.m3u8 \
            -w "%{http_code}" \
            "$URL") || true

          echo "קוד HTTP: ${HTTP_CODE:-לא התקבל}"

          echo "כותרות התשובה:"
          head -20 headers.txt 2>/dev/null || true

          echo "גודל התשובה:"
          wc -c playlist.m3u8 2>/dev/null || true

          echo "תוכן התשובה:"
          head -c 1000 playlist.m3u8 2>/dev/null || true
          echo

          if grep -q "#EXTM3U" playlist.m3u8 2>/dev/null; then
            echo "נמצאה רשימת HLS – השידור זמין לבדיקה."
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "השידור כבוי כרגע – ממשיכים להמתין."
          else
            echo "מקור השידור אינו זמין. קוד HTTP: $HTTP_CODE"
          fi
