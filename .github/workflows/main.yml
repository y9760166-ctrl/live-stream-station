
name: בדיקת שידור אוטומטית

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check-stream:
    runs-on: ubuntu-latest
    steps:
      - name: בדיקת מקור השידור
        run: |
          URL="https://contact.gostreaming.tv/Con-9/tracks-v3a1/mono.ts.m3u8"
          echo "בודק את מקור השידור..."
          curl -L --max-time 20 -sS "$URL" -o playlist.m3u8
          if grep -q "#EXTM3U" playlist.m3u8; then
            echo "נמצאה רשימת HLS."
            if grep -q "#EXT-X-ENDLIST" playlist.m3u8; then
              echo "השידור הסתיים."
            else
              echo "ייתכן שהשידור פעיל."
            fi
          else
            echo "מקור השידור אינו זמין או אינו רשימת HLS תקינה."
            exit 1
          fi
