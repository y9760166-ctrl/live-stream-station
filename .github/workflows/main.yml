name: הקלטת שידור אוטומטית

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: live-stream-recorder
  cancel-in-progress: false

jobs:
  record-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: הורדת קובצי המאגר
        uses: actions/checkout@v4

      - name: התקנת Node.js ובדיקת הקוד
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: בדיקת תחביר
        run: node --check server.js

      - name: התקנת FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: ניטור והקלטת השידור
        shell: bash
        run: |
          set -u
          URL="https://contact.gostreaming.tv/Con-9/tracks-v3a1/mono.ts.m3u8"
          mkdir -p recordings
          REC_PID=""
          LAST_SIGNATURE=""
          MISSES=0
          DEADLINE=$((SECONDS + 330 * 60))

          stop_recorder() {
            if [ -n "$REC_PID" ] && kill -0 "$REC_PID" 2>/dev/null; then
              echo "עוצר הקלטה..."
              kill -INT "$REC_PID" 2>/dev/null || true
              wait "$REC_PID" || true
            fi
            REC_PID=""
          }
          trap stop_recorder EXIT

          echo "הניטור התחיל. משך הרצה מרבי: 5 שעות וחצי."

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if [ -n "$REC_PID" ] && ! kill -0 "$REC_PID" 2>/dev/null; then
              echo "תהליך FFmpeg הסתיים."
              wait "$REC_PID" || true
              REC_PID=""
            fi

            if curl -L --max-time 15 -fsS "$URL" -o /tmp/live-playlist.m3u8 &&
               grep -q "#EXTM3U" /tmp/live-playlist.m3u8 &&
               ! grep -q "#EXT-X-ENDLIST" /tmp/live-playlist.m3u8; then

              LAST_SEGMENT=$(grep -v '^#' /tmp/live-playlist.m3u8 | sed '/^[[:space:]]*$/d' | tail -n 1)
              MEDIA_SEQUENCE=$(grep '^#EXT-X-MEDIA-SEQUENCE:' /tmp/live-playlist.m3u8 | tail -n 1 || true)
              SIGNATURE="${MEDIA_SEQUENCE}|${LAST_SEGMENT}"

              if [ -n "$LAST_SEGMENT" ] && [ "$SIGNATURE" != "$LAST_SIGNATURE" ]; then
                LAST_SIGNATURE="$SIGNATURE"
                MISSES=0

                if [ -z "$REC_PID" ]; then
                  echo "זוהו מקטעים חדשים. מתחיל הקלטה."
                  ffmpeg -hide_banner -loglevel warning \
                    -rw_timeout 15000000 \
                    -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
                    -i "$URL" -map 0 -c copy \
                    -f segment -segment_time 3600 -reset_timestamps 1 \
                    -strftime 1 "recordings/recording-%Y%m%d-%H%M%S.ts" \
                    > recordings/ffmpeg.log 2>&1 &
                  REC_PID=$!
                else
                  echo "השידור פעיל; ההקלטה נמשכת."
                fi
              else
                MISSES=$((MISSES + 1))
                echo "רשימת השידור לא התקדמה ($MISSES/3)."
              fi
            else
              MISSES=$((MISSES + 1))
              echo "מקור השידור אינו זמין כרגע ($MISSES/3)."
            fi

            if [ "$MISSES" -ge 3 ] && [ -n "$REC_PID" ]; then
              stop_recorder
              LAST_SIGNATURE=""
              MISSES=0
              echo "השידור נעצר; ממתין לחידושו."
            fi

            sleep 20
          done

          echo "חלון הניטור הסתיים."
          stop_recorder

      - name: איחוד קובצי TS לקובץ MP4 אחד
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          TS_FILES=(recordings/recording-*.ts)
          if [ ${#TS_FILES[@]} -eq 0 ]; then
            echo "לא נמצאו קובצי TS; אין מה להמיר."
            exit 0
          fi

          LIST_FILE="$RUNNER_TEMP/ts-files.txt"
          : > "$LIST_FILE"
          for file in "${TS_FILES[@]}"; do
            printf "file '%s/%s'\\n" "$GITHUB_WORKSPACE" "$file" >> "$LIST_FILE"
          done

          ffmpeg -hide_banner -loglevel warning -f concat -safe 0 \
            -i "$LIST_FILE" -map 0:v? -map 0:a? -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 128k \
            -movflags +faststart "recordings/live-replay-${GITHUB_RUN_NUMBER}.mp4"

          echo "נוצר קובץ MP4 מאוחד."

      - name: העלאת קובץ ה-MP4 ל-Google Drive
        if: always()
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "${RCLONE_CONFIG_CONTENT:-}" ]; then
            echo "טרם הוגדר סוד RCLONE_CONFIG ב-GitHub; דילוג על העלאה לדרייב."
            exit 0
          fi
          if ! compgen -G "recordings/*.mp4" > /dev/null; then
            echo "לא נוצר קובץ MP4; אין מה להעלות."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          rclone copy recordings "gdrive1:LiveStreamStation/${GITHUB_RUN_NUMBER}" \
            --include "*.mp4" --transfers 2 --checkers 4
          echo "העלאת קובץ ה-MP4 ל-Google Drive הסתיימה."
