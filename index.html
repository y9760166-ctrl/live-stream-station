<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תחנת השידור שלי</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:linear-gradient(135deg,#101827,#172554,#312e81);color:#fff;font-family:Arial,sans-serif}main{max-width:960px;margin:auto}.panel{background:#ffffff12;border:1px solid #ffffff25;border-radius:20px;padding:24px;margin-bottom:18px}h1{font-size:32px}.muted{color:#cbd5e1;line-height:1.7}.status{font-size:19px;font-weight:bold;margin:12px 0}video{display:block;width:100%;aspect-ratio:16/9;background:#05070d;border-radius:14px;margin-top:15px}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;margin-top:10px}
</style>
</head>
<body><main>
<section class="panel">
<h1>תחנת השידור שלי</h1>
<p class="muted">צפייה בשידור חי</p>
<div class="status" id="playerStatus">מכין את הנגן...</div>
<video id="player" controls playsinline preload="none"></video>
<p class="muted" id="playerMessage">כשהשידור יהיה פעיל, לחץ על הפעלה.</p>
<button id="reload">טען מחדש את השידור</button>
</section>
<section class="panel">
<h2>ארכיון הקלטות</h2>
<p class="muted">הארכיון יופיע כאן לאחר שנחבר את האתר לקובצי ההקלטה שב־Google Drive. החיבור עדיין לא הושלם.</p>
</section>
</main>
<script>
const STREAM_URL="https://contact.gostreaming.tv/Con-9/tracks-v3a1/mono.ts.m3u8";
const video=document.getElementById("player"), status=document.getElementById("playerStatus"), message=document.getElementById("playerMessage");
let hls;
function loadStream(){
 if(hls){hls.destroy();hls=null}
 status.textContent="מנסה להתחבר למקור השידור...";
 message.textContent="אם השידור פעיל, לחץ על הפעלה. אם אינו פעיל, נסה שוב בזמן השידור.";
 if(window.Hls&&Hls.isSupported()){
  hls=new Hls();hls.loadSource(STREAM_URL);hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent="המקור נטען";message.textContent="הנגן מוכן. לחץ על הפעלה."});
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){status.textContent="המקור אינו זמין כרגע";message.textContent="ייתכן שהשידור כבוי או שהמקור אינו נגיש כרגע. אפשר לנסות לטעון מחדש."}});
 }else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=STREAM_URL;status.textContent="כתובת השידור הוגדרה";}else{status.textContent="הדפדפן אינו תומך בניגון HLS";}
}
document.getElementById("reload").addEventListener("click",loadStream);
loadStream();
</script>
</body></html>
