
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תחנת השידור שלי</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px;
  background:linear-gradient(135deg,#101827,#172554,#312e81);
  color:white;font-family:Arial,sans-serif;
}
main{max-width:900px;margin:auto}
.panel,.card{
  background:#ffffff12;border:1px solid #ffffff25;
  border-radius:20px;padding:22px;margin-bottom:18px;
}
h1{font-size:38px}
.subtitle{color:#cbd5e1}
audio{width:100%;margin-top:20px}
.status{font-size:20px;font-weight:bold}
.small{color:#cbd5e1;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<main>
<section class="panel">
<h1>תחנת השידור שלי</h1>
<p class="subtitle">מערכת שידור חי והקלטה בענן</p>

<div class="card">
<h2>שידור חי</h2>
<div class="status" id="playerStatus">מתחבר למקור השידור...</div>
<audio id="player" controls></audio>
<p class="small" id="playerMessage">
לחץ על הפעלה כדי להאזין לשידור החי.
</p>
</div>

<div class="card">
<h2>מצב המערכת</h2>
<div id="status">טוען...</div>
<p>מספר הקלטות: <span id="count">—</span></p>
</div>

<div class="card">
<h2>ארכיון הקלטות</h2>
<ul id="recordings"><li>טוען...</li></ul>
</div>
</section>
</main>

<script>
const STREAM_URL =
"https://contact.gostreaming.tv/Con-9/tracks-v3a1/mono.ts.m3u8";

const player = document.getElementById("player");
const playerStatus = document.getElementById("playerStatus");
const playerMessage = document.getElementById("playerMessage");

function setPlayerStatus(status, message) {
  playerStatus.textContent = status;
  playerMessage.textContent = message;
}

if (Hls.isSupported()) {
  const hls = new Hls();

  hls.loadSource(STREAM_URL);
  hls.attachMedia(player);

  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    setPlayerStatus("השידור מוכן", "לחץ על הפעלה כדי להתחיל להאזין.");
  });

  hls.on(Hls.Events.ERROR, (event, data) => {
    if (data.fatal) {
      setPlayerStatus(
        "שגיאה בטעינת השידור",
        "ייתכן שמקור השידור אינו זמין או חוסם גישה מהאתר."
      );
    }
  });

} else if (player.canPlayType("application/vnd.apple.mpegurl")) {
  player.src = STREAM_URL;
  setPlayerStatus("השידור מוכן", "לחץ על הפעלה.");

} else {
  setPlayerStatus(
    "הדפדפן אינו תומך בנגן",
    "נסה לפתוח בדפדפן שתומך בשידורי HLS."
  );
}

async function updateStatus() {
  try {
    const response = await fetch("/api/status");
    const data = await response.json();

    document.getElementById("status").textContent = data.status;
    document.getElementById("count").textContent =
      data.recordings.length;

    const list = document.getElementById("recordings");
    list.innerHTML = "";

    if (!data.recordings.length) {
      list.innerHTML = "<li>עדיין אין הקלטות</li>";
    }

    data.recordings.forEach(file => {
      const item = document.createElement("li");
      item.textContent = file.name;
      list.appendChild(item);
    });

  } catch {
    document.getElementById("status").textContent =
      "השרת עדיין לא הופעל";
  }
}

updateStatus();
setInterval(updateStatus, 10000);
</script>
</body>
</html>
